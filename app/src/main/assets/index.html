:root {
  --bg: #f6f3eb;
  --surface: #ffffff;
  --surface-soft: #eef4ef;
  --surface-tint: #e4f0e8;
  --primary: #145a3a;
  --primary-dark: #0e422a;
  --primary-light: #e5f3ea;
  --primary-mid: #277853;
  --gold: #d9a036;
  --text: #18231d;
  --text-muted: #5e6e65;
  --border: rgba(20, 90, 58, 0.11);
  --shadow: 0 4px 16px rgba(16, 48, 33, 0.06);
  --shadow-lg: 0 10px 28px rgba(14, 52, 34, 0.14);
  --danger: #dc2626;
  --radius: 18px;
}

body.dark {
  --bg: #0f1713;
  --surface: #17231d;
  --surface-soft: #1d2d25;
  --surface-tint: #21352b;
  --primary: #2ca86e;
  --primary-dark: #165e3d;
  --primary-light: rgba(44, 168, 110, 0.16);
  --primary-mid: #38be7f;
  --text: #eef4f0;
  --text-muted: #98aba0;
  --border: rgba(255, 255, 255, 0.08);
  --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.5);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  user-select: none;
}

input, textarea, select {
  user-select: text;
}

/* Hind Siliguri light weight specifically for numbers */
.bn-num {
  font-family: 'Hind Siliguri', sans-serif;
  font-weight: 300 !important;
  font-variant-numeric: tabular-nums;
}

/* Splash Screen */
#splashScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: radial-gradient(circle at 50% 36%, #1f764e 0%, #135738 55%, #0c3d26 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  transition: opacity 0.45s ease, visibility 0.45s ease;
  padding: 32px;
  text-align: center;
}
#splashScreen.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.splash-logo-wrap {
  width: 148px;
  height: 148px;
  border-radius: 36px;
  overflow: hidden;
  box-shadow: 0 18px 40px rgba(0,0,0,0.32), 0 0 0 3px rgba(246, 211, 127, 0.35);
  margin-bottom: 22px;
  background: #145a3a;
}
.splash-logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.splash-title {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fdfaf2;
  text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}
.splash-sub {
  margin-top: 12px;
  font-size: 16px;
  font-weight: 400;
  color: rgba(253, 250, 242, 0.88);
  line-height: 1.5;
}
.splash-line {
  width: 44px;
  height: 2px;
  background: rgba(246, 211, 127, 0.65);
  border-radius: 2px;
  margin: 14px auto 0;
}

/* App Lock Screen */
#lockScreen {
  position: fixed;
  inset: 0;
  z-index: 9500;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px;
  text-align: center;
}
.pin-dots {
  display: flex;
  gap: 14px;
  margin: 22px 0;
}
.pin-dot {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2px solid var(--primary);
  transition: background 0.15s;
}
.pin-dot.filled {
  background: var(--primary);
}
.pin-keypad {
  display: grid;
  grid-template-columns: repeat(3, 72px);
  gap: 14px;
  margin-top: 10px;
}
.pin-key {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 24px;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.pin-key:active {
  background: var(--primary-light);
  transform: scale(0.94);
}

/* App Shell */
#app {
  min-height: 100vh;
  padding-bottom: 94px;
  max-width: 520px;
  margin: 0 auto;
}

/* Top Header */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  padding: 14px 18px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
}
body.dark .brand-title {
  color: var(--text);
}
.page-header-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 21px;
  font-weight: 700;
  color: var(--text);
}
.page-header-title svg {
  color: var(--primary);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-circle-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}
.icon-circle-btn:active {
  transform: scale(0.95);
}

.container {
  padding: 4px 16px 16px;
}

/* Search Bar */
.search-bar-wrap {
  margin-bottom: 12px;
  position: relative;
}
.search-input {
  width: 100%;
  padding: 11px 38px 11px 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.search-clear {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
}

/* Summary Banner Card ("আমার মানুষজন") */
.hero-summary-card {
  background: linear-gradient(135deg, var(--surface-tint) 0%, var(--surface-soft) 100%);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  cursor: pointer;
}
.hero-summary-left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.hero-summary-icon {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.hero-summary-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
}
.hero-summary-sub {
  font-size: 13.5px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Today / Next Highlight Card ("আজকের দিন / পরবর্তী স্মরণীয় দিন") */
.today-highlight-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--gold);
  border-radius: 16px;
  padding: 12px 14px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
}
.today-hl-tag {
  font-size: 11px;
  font-weight: 700;
  color: #b45309;
  background: #fef3c7;
  padding: 2px 8px;
  border-radius: 8px;
  display: inline-block;
  margin-bottom: 3px;
}
body.dark .today-hl-tag {
  background: rgba(217, 160, 54, 0.2);
  color: #f6d37f;
}

/* Section Heading */
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 6px 2px 10px;
}
.sec-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.sec-link {
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  background: none;
  border: none;
  cursor: pointer;
}

/* Person List Cards (No Photos - Initials Avatar + Name + Pin) */
.person-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 13px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.12s ease;
}
.person-card:active {
  transform: scale(0.985);
}
.person-left {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
}
.avatar-initials {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  font-weight: 700;
  flex-shrink: 0;
  letter-spacing: 0.3px;
}
.person-info {
  min-width: 0;
}
.person-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 6px;
}
.person-meta {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}
.chev-muted {
  color: var(--text-muted);
  flex-shrink: 0;
}
.pin-badge {
  color: var(--gold);
  display: inline-flex;
  align-items: center;
}

/* Add Person Pill Button */
.add-person-bar {
  width: 100%;
  margin-top: 8px;
  padding: 14px 16px;
  border-radius: 16px;
  border: 1.5px dashed rgba(20, 90, 58, 0.32);
  background: var(--surface-soft);
  color: var(--primary);
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
body.dark .add-person-bar {
  border-color: rgba(44, 168, 110, 0.35);
}
.add-person-bar:active {
  transform: scale(0.985);
}

/* Person Detail Screen */
.profile-banner {
  background: linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #ffffff;
  padding: 14px 16px 26px;
  border-bottom-left-radius: 28px;
  border-bottom-right-radius: 28px;
  box-shadow: var(--shadow-lg);
}
.profile-top-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.glass-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.13);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.glass-btn.active-pin {
  background: rgba(217, 160, 54, 0.32);
  border-color: #f6d37f;
  color: #f6d37f;
}
.profile-hero-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.profile-avatar-lg {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  border: 3px solid rgba(246, 211, 127, 0.85);
  color: #ffffff;
  font-size: 30px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.22);
}
.profile-hero-name {
  font-size: 23px;
  font-weight: 700;
  line-height: 1.25;
}
.profile-hero-sub {
  font-size: 13.5px;
  color: rgba(255,255,255,0.88);
  margin-top: 3px;
}

/* Dual Info Cards under Profile */
.dual-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: -14px 16px 14px;
}
.info-mini-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 13px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.info-mini-ic {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.info-mini-label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
}
.info-mini-val {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text);
  margin-top: 1px;
  line-height: 1.35;
}

/* Sub Tabs inside Person Profile */
.sub-tabs {
  display: flex;
  border-bottom: 1.5px solid var(--border);
  margin: 0 16px 14px;
}
.sub-tab {
  flex: 1;
  text-align: center;
  padding: 10px 6px;
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text-muted);
  background: none;
  border: none;
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1.5px;
  cursor: pointer;
}
.sub-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

/* Timeline & Event Row Card */
.timeline-wrap {
  position: relative;
  padding-left: 18px;
}
.timeline-wrap::before {
  content: '';
  position: absolute;
  left: 5px;
  top: 12px;
  bottom: 12px;
  width: 2px;
  background: var(--border);
}
.timeline-item {
  position: relative;
}
.timeline-dot {
  position: absolute;
  left: -17px;
  top: 22px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 1.5px var(--primary);
}
.ev-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.12s ease;
}
.ev-card:active {
  transform: scale(0.985);
}
.ev-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.ev-icon-box {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ev-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ev-sub {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 2px;
}
.ev-badge {
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  background: var(--primary-light);
  padding: 4px 9px;
  border-radius: 10px;
  white-space: nowrap;
  flex-shrink: 0;
}

/* Milestone Pill Strip */
.milestone-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.milestone-pill {
  background: var(--surface-soft);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 11px;
  font-size: 12.5px;
  flex: 1 1 46%;
}
.milestone-pill strong {
  display: block;
  color: var(--primary);
  font-size: 13.5px;
}

/* Calendar Screen */
.cal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.cal-nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.cal-month-btn {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.cal-arrow {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-soft);
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-day {
  aspect-ratio: 1;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  cursor: pointer;
  position: relative;
  color: var(--text);
}
.cal-day.muted {
  color: var(--text-muted);
  opacity: 0.35;
  pointer-events: none;
}
.cal-day.today {
  border: 1.5px solid var(--primary);
  color: var(--primary);
}
.cal-day.selected {
  background: var(--primary);
  color: #ffffff;
}
.cal-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  position: absolute;
  bottom: 5px;
}
.cal-day.selected .cal-dot {
  background: #ffffff;
}

/* Stats Screen */
.filter-pills {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.filter-pill {
  flex: 1;
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}
.filter-pill.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}
.donut-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}
.donut-wrap {
  position: relative;
  width: 126px;
  height: 126px;
  flex-shrink: 0;
}
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
}
.donut-big {
  font-size: 25px;
  color: var(--text);
  line-height: 1.1;
}
.donut-sub {
  font-size: 12px;
  color: var(--text-muted);
}
.legend-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.legend-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13.5px;
}
.legend-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.legend-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  font-weight: 500;
}
.legend-val {
  color: var(--text);
}
.records-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.record-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 13px;
  box-shadow: var(--shadow);
}
.record-lbl {
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 600;
}
.record-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.record-sub {
  font-size: 12px;
  color: var(--primary);
  margin-top: 2px;
}

/* Settings Screen */
.settings-group-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  margin: 12px 4px 8px;
}
.theme-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.theme-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 14px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.theme-card.active {
  border-color: var(--primary);
  background: var(--surface-soft);
  color: var(--primary);
}
.accent-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 2px 14px;
}
.accent-swatch {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 3px solid transparent;
  cursor: pointer;
}
.accent-swatch.active {
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4.5px var(--text);
}
.settings-menu-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.settings-row {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  background: none;
  width: 100%;
  text-align: left;
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
}
.settings-row:last-child {
  border-bottom: none;
}
.settings-row-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.settings-row-ic {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--primary-light);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Bottom Navigation Bar with Raised Center '+' Button */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 60;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: end;
  max-width: 520px;
  margin: 0 auto;
  box-shadow: 0 -4px 18px rgba(0,0,0,0.04);
}
.nav-item {
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 0;
}
.nav-item.active {
  color: var(--primary);
}
.nav-center-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: -22px;
}
.nav-fab {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--primary);
  color: #ffffff;
  border: 4px solid var(--bg);
  box-shadow: 0 6px 16px rgba(20, 90, 58, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 300;
  cursor: pointer;
}
.nav-fab:active {
  transform: scale(0.93);
}

/* Modals & Bottom Sheets */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(10, 24, 17, 0.52);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.overlay.center {
  align-items: center;
  padding: 18px;
}
.sheet {
  background: var(--surface);
  color: var(--text);
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  border-top-left-radius: 26px;
  border-top-right-radius: 26px;
  padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-lg);
}
.overlay.center .sheet {
  border-radius: 24px;
  max-width: 420px;
}
.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.sheet-header .t {
  font-size: 18px;
  font-weight: 700;
}
.close-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--surface-soft);
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* Category Grid */
.cat-grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
  margin-bottom: 14px;
}
.cat-tile {
  border: 1.5px solid var(--border);
  background: var(--surface);
  border-radius: 14px;
  padding: 10px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  text-align: center;
}
.cat-tile.active {
  border-color: var(--primary);
  background: var(--surface-soft);
}
.cat-tile-ic {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cat-tile-lbl {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
}

/* Person Selector Pills */
.person-pill-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 12px;
}
.person-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px 6px 7px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}
.person-pill.active {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
}
.pill-mini-av {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Forms */
.field {
  margin-bottom: 12px;
}
.field-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 5px;
}
.input {
  width: 100%;
  padding: 11px 13px;
  border-radius: 13px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 14.5px;
  outline: none;
}
.input:focus {
  border-color: var(--primary);
}
.primary-btn {
  width: 100%;
  padding: 13px 16px;
  border-radius: 14px;
  border: none;
  background: var(--primary);
  color: #ffffff;
  font-size: 15.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  margin-top: 4px;
}
.primary-btn:active {
  transform: scale(0.985);
}
.ghost-btn {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface-soft);
  color: var(--text);
  font-size: 14.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  margin-top: 8px;
}
.danger-btn {
  color: var(--danger);
  background: rgba(220, 38, 38, 0.08);
  border-color: rgba(220, 38, 38, 0.2);
}

/* Icon & Color Pickers */
.icon-grid-6 {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}
.icon-opt {
  aspect-ratio: 1;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.icon-opt.active {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
}
.color-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.color-opt {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2.5px solid transparent;
  cursor: pointer;
}
.color-opt.active {
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text);
}

/* Custom Date Picker */
.dp-popup {
  margin-top: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px;
  box-shadow: var(--shadow-lg);
}
.dp-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 8px;
}
.dp-navbtn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-soft);
  color: var(--text);
  cursor: pointer;
}
.dp-select {
  padding: 5px 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
}
.dp-weekdays, .dp-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  gap: 3px;
}
.dp-weekdays {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.dp-cell {
  padding: 6px 0;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}
.dp-cell.today {
  border: 1px solid var(--primary);
}
.dp-cell.selected {
  background: var(--primary);
  color: #fff;
}
.dp-quickrow {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 8px;
}
.dp-quick {
  padding: 5px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-soft);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
}

/* Event Detail Box */
.detail-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}
.detail-icon {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.detail-dur {
  background: var(--surface-soft);
  border-radius: 16px;
  padding: 14px;
  text-align: center;
  margin-bottom: 12px;
}
.detail-dur .big {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
}
.detail-dur .small {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 3px;
}
.note-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 11px 13px;
  font-size: 14px;
  line-height: 1.5;
}
.note-box.empty {
  color: var(--text-muted);
  font-style: italic;
}

/* Toast */
#toastHost {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  width: calc(100% - 32px);
  max-width: 440px;
  pointer-events: none;
}
.toast {
  background: #17271f;
  color: #fff;
  padding: 11px 15px;
  border-radius: 14px;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  box-shadow: var(--shadow-lg);
  pointer-events: auto;
}
.toast-act {
  background: var(--gold);
  color: #111;
  border: none;
  padding: 4px 10px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 12.5px;
  cursor: pointer;
}

.empty-state {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px 18px;
  text-align: center;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}
.empty-state h3 {
  font-size: 18px;
  margin-bottom: 6px;
}
.empty-state p {
  font-size: 13.5px;
  color: var(--text-muted);
  line-height: 1.5;
}
</style>
</head>

<script>
/* ---------- Splash ---------- */
function dismissSplash() {
  const s = document.getElementById('splashScreen');
  if (s) s.classList.add('hide');
}
setTimeout(dismissSplash, 1450);

/* ---------- Helpers (Numbers styled in Hind Siliguri weight 300) ---------- */
const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function toBn(n) {
  return `<span class="bn-num">${String(n).replace(/[0-9]/g, d => bnDigits[d])}</span>`;
}
function toBnPlain(n) {
  return String(n).replace(/[0-9]/g, d => bnDigits[d]);
}
const bnMonths = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const bnWeekdaysShort = ['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];

function parseDate(str) {
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function todayMid() {
  const t = new Date();
  t.setHours(0,0,0,0);
  return t;
}
function fmtBnDate(d) {
  return `${toBn(d.getDate())} ${bnMonths[d.getMonth()]} ${toBn(d.getFullYear())}`;
}
function fmtBnDayMonth(d) {
  return `${toBn(d.getDate())} ${bnMonths[d.getMonth()]}`;
}
function diffYMD(start, end) {
  let y = end.getFullYear() - start.getFullYear();
  let m = end.getMonth() - start.getMonth();
  let d = end.getDate() - start.getDate();
  if (d < 0) {
    m--;
    d += new Date(end.getFullYear(), end.getMonth(), 0).getDate();
  }
  if (m < 0) {
    y--;
    m += 12;
  }
  return {y, m, d};
}
function ymdText(y, m, d) {
  const parts = [];
  if (y > 0) parts.push(`${toBn(y)} বছর`);
  if (m > 0) parts.push(`${toBn(m)} মাস`);
  if (d > 0) parts.push(`${toBn(d)} দিন`);
  return parts.length ? parts.join(' ') : 'আজ';
}
function durationDisplay(dateStr) {
  const start = parseDate(dateStr), today = todayMid();
  if (start > today) {
    const total = Math.round((start - today) / 86400000);
    const {y, m, d} = diffYMD(today, start);
    return {future: true, big: `${ymdText(y,m,d)} বাকি`, small: `মোট ${toBn(total)} দিন বাকি`, totalDays: total};
  }
  const total = Math.round((today - start) / 86400000);
  const {y, m, d} = diffYMD(start, today);
  return {future: false, big: ymdText(y,m,d), small: total > 0 ? `মোট ${toBn(total)} দিন` : 'আজকের ঘটনা', totalDays: total};
}
function nextAnnivDays(dateStr) {
  const start = parseDate(dateStr), today = todayMid();
  let next = new Date(today.getFullYear(), start.getMonth(), start.getDate());
  if (next < today) next.setFullYear(today.getFullYear() + 1);
  return Math.round((next - today) / 86400000);
}
function countdownLabel(days) {
  if (days === 0) return 'আজ';
  return `আর ${toBn(days)} দিন বাকি`;
}
function getInitials(name) {
  const clean = (name || '').trim();
  if (!clean) return 'আ';
  const words = clean.split(/\s+/);
  if (words.length >= 2) {
    return Array.from(words[0])[0] + Array.from(words[1])[0];
  }
  return Array.from(clean).slice(0, 2).join('');
}
const AVATAR_PALETTES = [
  {bg: '#dff2e7', fg: '#145a3a'},
  {bg: '#e3ecfc', fg: '#1d4ed8'},
  {bg: '#fce7f3', fg: '#be185d'},
  {bg: '#fef3c7', fg: '#b45309'},
  {bg: '#e0f2fe', fg: '#0369a1'},
  {bg: '#ede9fe', fg: '#6d28d9'}
];
function avatarStyle(idx) {
  const p = AVATAR_PALETTES[idx % AVATAR_PALETTES.length];
  return `background:${p.bg};color:${p.fg};`;
}

/* Upcoming Milestones helper (1000 days, 10000 days, Silver/Golden Jubilee) */
function computeMilestones(dateStr) {
  const start = parseDate(dateStr), today = todayMid();
  if (start > today) return [];
  const totalDays = Math.round((today - start) / 86400000);
  const items = [];
  const dayTargets = [100, 500, 1000, 5000, 10000, 15000, 20000];
  const nextDayTarget = dayTargets.find(t => t > totalDays);
  if (nextDayTarget) {
    const targetDate = new Date(start.getTime() + nextDayTarget * 86400000);
    items.push({
      title: `${toBn(nextDayTarget)} দিন পূর্তি`,
      date: fmtBnDate(targetDate),
      left: `আর ${toBn(nextDayTarget - totalDays)} দিন বাকি`
    });
  }
  const yearsPassed = today.getFullYear() - start.getFullYear();
  const yearTargets = [1, 5, 10, 15, 20, 25, 30, 40, 50, 60, 75, 100];
  const nextYr = yearTargets.find(y => y > yearsPassed || (y === yearsPassed && new Date(today.getFullYear(), start.getMonth(), start.getDate()) >= today));
  if (nextYr) {
    const yrDate = new Date(start.getFullYear() + nextYr, start.getMonth(), start.getDate());
    const diffD = Math.round((yrDate - today) / 86400000);
    if (diffD >= 0) {
      items.push({
        title: `${toBn(nextYr)} বছর পূর্তি`,
        date: fmtBnDate(yrDate),
        left: diffD === 0 ? 'আজ' : `আর ${toBn(diffD)} দিন বাকি`
      });
    }
  }
  return items;
}

  calMonth: new Date().getMonth(),

  people: [],

};

let pinBuffer = '';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      people: state.people,
      uid,
      dark: state.dark,
      theme: state.theme,
      accent: state.accent,
      pinCode: state.pinCode,
      customCats: state.customCats
    }));
  } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (saved && Array.isArray(saved.people)) {
      state.people = saved.people;
      uid = saved.uid || uid;
      state.theme = saved.theme || (saved.dark ? 'dark' : 'light');
      state.accent = typeof saved.accent === 'number' ? saved.accent : 0;
      state.pinCode = saved.pinCode || '';
      state.unlocked = !state.pinCode;
      state.customCats = saved.customCats && typeof saved.customCats === 'object' ? saved.customCats : {};
      return true;
    }
  } catch (e) {}
  return false;
}

function applyThemeAndAccent() {
  let isDark = state.theme === 'dark';
  if (state.theme === 'system') {
    isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  state.dark = isDark;
  document.body.classList.toggle('dark', isDark);

  const acc = ACCENT_PRESETS[state.accent] || ACCENT_PRESETS[0];
  document.documentElement.style.setProperty('--primary', isDark ? acc.mid : acc.primary);
  document.documentElement.style.setProperty('--primary-dark', acc.dark);
  document.documentElement.style.setProperty('--primary-mid', acc.mid);
  document.documentElement.style.setProperty('--primary-light', isDark ? acc.darkLight : acc.light);
}

/* PIN Lock Logic */
function checkLockScreen() {
  const ls = document.getElementById('lockScreen');
  if (!ls) return;
  if (state.pinCode && !state.unlocked) {
    document.getElementById('lockIconHost').innerHTML = ic('lock', 26);
    ls.style.display = 'flex';
  } else {
    ls.style.display = 'none';
  }
}
function pressPin(digit) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += digit;
  updatePinDots();
  if (pinBuffer.length === 4) {
    setTimeout(() => {
      if (pinBuffer === state.pinCode) {
        state.unlocked = true;
        pinBuffer = '';
        checkLockScreen();
      } else {
        pinBuffer = '';
        updatePinDots();
        showToast('ভুল পিন কোড! আবার চেষ্টা করুন');
      }
    }, 140);
  }
}
function backspacePin() {
  pinBuffer = pinBuffer.slice(0, -1);
  updatePinDots();
}
function updatePinDots() {
  document.querySelectorAll('#pinDots .pin-dot').forEach((d, i) => {
    d.classList.toggle('filled', i < pinBuffer.length);
  });
}

function allCats() {
  return Object.assign({}, CATS, state.customCats);
}
function catOf(key) {
  return allCats()[key] || CATS.other;
}
function allEvents() {
  const out = [];
  state.people.forEach(p => {
    (p.events || []).forEach(e => out.push({...e, personName: p.name, personId: p.id}));
  });
  return out;
}
function findPerson(id) {
  return state.people.find(p => p.id === id);
}
function findEvent(pid, eid) {
  const p = findPerson(pid);
  return p ? (p.events || []).find(e => e.id === eid) : null;
}
function upcomingCountForPerson(p) {
  return (p.events || []).filter(e => nextAnnivDays(e.date) <= 90).length;
}

/* ---------- Screen 4: Calendar ---------- */
function renderCalendar() {
  const first = new Date(state.calYear, state.calMonth, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(state.calYear, state.calMonth + 1, 0).getDate();
  const prevMonthDays = new Date(state.calYear, state.calMonth, 0).getDate();
  const today = todayMid();

  const events = allEvents();
  const monthEventsMap = {};
  events.forEach(e => {
    const d = parseDate(e.date);
    if (d.getMonth() === state.calMonth) {
      const day = d.getDate();
      if (!monthEventsMap[day]) monthEventsMap[day] = [];
      monthEventsMap[day].push(e);
    }
  });

  let cells = '';
  for (let i = startDay - 1; i >= 0; i--) {
    cells += `<div class="cal-day muted">${toBn(prevMonthDays - i)}</div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = today.getFullYear() === state.calYear && today.getMonth() === state.calMonth && today.getDate() === d;
    const isSel = state.calSelected === d;
    const hasEv = !!monthEventsMap[d];
    cells += `
      <div class="cal-day ${isToday ? 'today' : ''} ${isSel ? 'selected' : ''}" onclick="selectCalDay(${d})">
        ${toBn(d)}
        ${hasEv ? `<span class="cal-dot"></span>` : ''}
      </div>
    `;
  }
  const totalCells = startDay + daysInMonth;
  const rem = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= rem; i++) {
    cells += `<div class="cal-day muted">${toBn(i)}</div>`;
  }

  const selDay = state.calSelected || today.getDate();
  const dayEvents = monthEventsMap[selDay] || [];

  return `
    <div class="topbar">
      <div class="page-header-title">${ic('calendar', 21)} ক্যালেন্ডার</div>
      <div class="top-actions">
        <button class="icon-circle-btn" onclick="calToday()" title="আজকের তারিখে যান" style="font-size:12px;font-weight:700;">আজ</button>
      </div>
    </div>
    <div class="container">
      <div class="cal-card">
        <div class="cal-nav-row">
          <button class="cal-arrow" onclick="calNav(-1)">${ic('chevronLeft', 18)}</button>
          <button class="cal-month-btn" onclick="openModal({type:'yearJump'})">${bnMonths[state.calMonth]} ${toBn(state.calYear)}</button>
          <button class="cal-arrow" onclick="calNav(1)">${ic('chevronRight', 18)}</button>
        </div>
        <div class="cal-weekdays">
          ${bnWeekdaysShort.map(w => `<div>${w}</div>`).join('')}
        </div>
        <div class="cal-grid">${cells}</div>
      </div>

      <div class="sec-head">
        <div class="sec-title">${toBn(selDay)} ${bnMonths[state.calMonth]}-এর ইভেন্ট</div>
      </div>

      ${dayEvents.length === 0 ? `
        <div class="empty-state" style="padding:20px;">
          <p>এই দিনে কোনো ইভেন্ট নেই</p>
        </div>
      ` : dayEvents.map(e => {
        const cat = catOf(e.category);
        return `
          <div class="ev-card" onclick="openModal({type:'eventDetail', personId:${e.personId}, eventId:${e.id}})">
            <div class="ev-left">
              <div class="ev-icon-box" style="background:${cat.bg};color:${cat.color};">${evIcon(e.icon, 21)}</div>
              <div style="min-width:0;">
                <div class="ev-title">${e.personName}-এর ${e.name}</div>
                <div class="ev-sub">${fmtBnDate(parseDate(e.date))}</div>
              </div>
            </div>
            <span class="chev-muted">${ic('chevronRight', 18)}</span>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* ---------- Screen 6: Stats & Donut Chart ---------- */
function buildDonutSVG(entries, total) {
  const r = 46, cx = 63, cy = 63, circ = 2 * Math.PI * r;
  if (total === 0) {
    return `<svg width="126" height="126" viewBox="0 0 126 126">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="16"/>
    </svg>`;
  }
  let offset = 0;
  const segs = entries.map(([k, cnt]) => {
    const c = catOf(k);
    const len = (cnt / total) * circ;
    const dash = `${Math.max(len - 2, 1)} ${circ}`;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.color}" stroke-width="16" stroke-dasharray="${dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += len;
    return seg;
  }).join('');
  return `<svg width="126" height="126" viewBox="0 0 126 126">${segs}</svg>`;
}

            </button>
          `).join('')}

      ` : ''}

      <div class="donut-card">

          ${buildDonutSVG(sortedCats, events.length)}

                  <div class="cat-tile-lbl">${c.label}</div>
                </div>
              `).join('')}
              <div class="cat-tile" onclick="openModal({type:'addCategory', returnTo:'addEvent'})">
                <div class="cat-tile-ic" style="background:var(--surface-soft);color:var(--primary);">${ic('plus', 19)}</div>
                <div class="cat-tile-lbl">নিজস্ব ক্যাটাগরি</div>
              </div>
            </div>

            <div class="field">
              <div class="field-label">ইভেন্টের নাম</div>
              <input class="input" id="evName" value="${ev ? ev.name : ''}" placeholder="যেমন: জন্মদিন, বিবাহ, বিএসসি সম্পন্ন">
            </div>

            <div class="field">
              <div class="field-label">তারিখ নির্বাচন করুন</div>
              <input type="hidden" id="evDate" value="${isoDate}">
              <button type="button" class="input" style="text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;" onclick="toggleDatePicker(event)">
                <span id="evDateDisplay">${fmtBnDate(new Date(dpSelYear, dpSelMonth, dpSelDay))}</span>
                ${ic('calendar', 17)}
              </button>
              <div id="dpPopup" class="dp-popup" style="display:none;"></div>
            </div>

            <div class="field">
              <div class="field-label">নোট (ঐচ্ছিক)</div>
              <textarea class="input" id="evNote" rows="2" placeholder="এই ইভেন্ট সম্পর্কে কিছু লিখুন...">${ev ? (ev.note || '') : ''}</textarea>
            </div>

            <button class="primary-btn" onclick="${isEdit ? `submitEditEvent(${m.personId},${m.eventId})` : 'submitAddEvent()'}">
              ${isEdit ? 'পরিবর্তন সংরক্ষণ করুন' : 'ইভেন্ট সংরক্ষণ করুন'}
            </button>
          `}
        </div>
      </div>
    `;
  }

  // Add Custom Category Modal
  if (m.type === 'addCategory') {
    return `
      <div class="overlay center" onclick="closeModalBG(event)">
        <div class="sheet">
          <div class="sheet-header">
            <span class="t">নতুন ক্যাটাগরি যোগ করুন</span>
            <button class="close-btn" onclick="${m.returnTo ? `openModal({type:'${m.returnTo}'})` : 'closeModal()'}">${ic('x', 16)}</button>
          </div>
          <div style="display:flex;justify-content:center;margin-bottom:12px;">
            <div id="newCatPreview" style="width:54px;height:54px;border-radius:16px;background:#e5f3ea;color:#145a3a;display:flex;align-items:center;justify-content:center;">
              ${ic('star', 26)}
            </div>
          </div>
          <div class="field">
            <div class="field-label">ক্যাটাগরির নাম লিখুন</div>
            <input class="input" id="newCatName" placeholder="যেমন: প্রকল্প">
          </div>
          <div class="field">
            <div class="field-label">আইকন নির্বাচন করুন</div>
            <div class="icon-grid-6" id="newCatIconGrid">
              ${ICON_CHOICES.slice(0, 6).map((ik, i) => `
                <div class="icon-opt ${i===0?'active':''}" data-nicon="${ik}" onclick="pickNewCatIcon(this, '${ik}')">${ic(ik, 19)}</div>
              `).join('')}
            </div>
          </div>
          <div class="field">
            <div class="field-label">রং নির্বাচন করুন</div>
            <div class="color-row" id="newCatColorRow">
              ${CAT_COLOR_PRESETS.map((cp, i) => `
                <div class="color-opt ${i===0?'active':''}" style="background:${cp.color};" data-color="${cp.color}" data-bg="${cp.bg}" onclick="pickNewCatColor(this)"></div>
              `).join('')}
            </div>
          </div>
          <button class="primary-btn" onclick="submitNewCategory('${m.returnTo || ''}')">সংরক্ষণ করুন</button>
        </div>
      </div>
    `;
  }

  // Event Detail Modal (with Milestones!)
  if (m.type === 'eventDetail') {
    const p = findPerson(m.personId);
    const e = findEvent(m.personId, m.eventId);
    if (!p || !e) return '';
    const cat = catOf(e.category);
    const dur = durationDisplay(e.date);
    const nd = nextAnnivDays(e.date);
    const milestones = computeMilestones(e.date);
    return `
      <div class="overlay" onclick="closeModalBG(event)">
        <div class="sheet">
          <div class="sheet-header">
            <span class="t">ইভেন্টের বিবরণ</span>
            <button class="close-btn" onclick="closeModal()">${ic('x', 16)}</button>
          </div>
          <div class="detail-head">
            <div class="detail-icon" style="background:${cat.bg};color:${cat.color};">${evIcon(e.icon, 26)}</div>
            <div>
              <div style="font-size:18px;font-weight:700;">${e.name}</div>
              <div class="ev-sub">${p.name} • ${fmtBnDate(parseDate(e.date))}</div>
              <span class="ev-badge" style="display:inline-block;margin-top:4px;background:${cat.bg};color:${cat.color};">${cat.label}</span>
            </div>
          </div>
          <div class="detail-dur">
            <div class="big">${dur.big}</div>
            <div class="small">${dur.small}</div>
            ${!dur.future ? `<div class="small" style="margin-top:4px;">পরবর্তী বার্ষিকী: ${countdownLabel(nd)}</div>` : ''}
          </div>

          ${milestones.length > 0 ? `
            <div class="field-label">আসন্ন মাইলফলক</div>
            <div class="milestone-row" style="margin-bottom:14px;">
              ${milestones.map(ms => `
                <div class="milestone-pill">
                  <strong>${ms.title}</strong>
                  <div style="color:var(--text-muted);font-size:11.5px;">${ms.date}</div>
                  <div style="color:var(--primary);font-size:11.5px;margin-top:2px;">${ms.left}</div>
                </div>
              `).join('')}
            </div>
          ` : ''}

          <div class="field-label">নোট</div>
          <div class="note-box ${!e.note?'empty':''}" style="margin-bottom:14px;">${e.note || 'কোনো নোট যোগ করা হয়নি'}</div>
          <button class="primary-btn" onclick="shareEvent(${p.id}, ${e.id})">${ic('share', 17)} শেয়ার করুন</button>
          <button class="ghost-btn" onclick="openModal({type:'editEvent', personId:${p.id}, eventId:${e.id}})">${ic('pencil', 17)} ইভেন্ট এডিট করুন</button>
          <button class="ghost-btn danger-btn" onclick="deleteEvent(${p.id}, ${e.id})">${ic('trash', 17)} ইভেন্ট মুছে ফেলুন</button>
        </div>
      </div>
    `;
  }

  // PIN Lock Settings Modal
  if (m.type === 'pinSettings') {
    return `
      <div class="overlay center" onclick="closeModalBG(event)">
        <div class="sheet">
          <div class="sheet-header">
            <span class="t">অ্যাপ লক (পিন কোড)</span>
            <button class="close-btn" onclick="closeModal()">${ic('x', 16)}</button>
          </div>
          <p class="ev-sub" style="margin-bottom:12px;">আপনার ব্যক্তিগত স্মৃতি ও তথ্য সুরক্ষিত রাখতে ৪ সংখ্যার পিন সেট করুন।</p>
          <div class="field">
            <div class="field-label">নতুন ৪ সংখ্যার পিন লিখুন</div>
            <input class="input" id="newPinInput" type="tel" maxlength="4" pattern="[0-9]*" placeholder="যেমন: 1234">
          </div>
          <button class="primary-btn" onclick="saveNewPin()">পিন সংরক্ষণ করুন</button>
          ${state.pinCode ? `<button class="ghost-btn danger-btn" onclick="removePin()">পিন লক বন্ধ করুন</button>` : ''}
        </div>
      </div>
    `;
  }

  // Backup & Restore Modal
  if (m.type === 'backup') {
    return `
      <div class="overlay" onclick="closeModalBG(event)">
        <div class="sheet">
          <div class="sheet-header">
            <span class="t">ব্যাকআপ ও রিস্টোর</span>
            <button class="close-btn" onclick="closeModal()">${ic('x', 16)}</button>
          </div>
          <p class="ev-sub" style="margin-bottom:12px;">সব ডেটা অফলাইনে ফোনে সংরক্ষিত থাকে। নিয়মিত ব্যাকআপ কপি রাখুন।</p>
          <button class="primary-btn" onclick="copyBackupDirect()">${ic('clipboard', 17)} ব্যাকআপ টেক্সট কপি করুন</button>
          <button class="ghost-btn" onclick="exportBackup()">${ic('download', 17)} JSON ব্যাকআপ শেয়ার/দেখুন</button>
          <button class="ghost-btn" onclick="triggerImport()">${ic('upload', 17)} JSON ফাইল থেকে রিস্টোর করুন</button>
          <button class="ghost-btn" onclick="openModal({type:'importText'})">${ic('clipboard', 17)} টেক্সট পেস্ট করে রিস্টোর করুন</button>
          <button class="ghost-btn danger-btn" onclick="resetAll()">${ic('trash', 17)} সব ডেটা মুছুন</button>
        </div>
      </div>
    `;
  }

  if (m.type === 'backupText') {
    return `
      <div class="overlay center" onclick="closeModalBG(event)">
        <div class="sheet">
          <div class="sheet-header">
            <span class="t">ব্যাকআপ টেক্সট</span>
            <button class="close-btn" onclick="closeModal()">${ic('x', 16)}</button>
          </div>
          <textarea class="input" id="backupTextArea" readonly rows="6" style="font-size:11px;" onclick="this.select()">${m.payload}</textarea>
          <button class="primary-btn" style="margin-top:10px;" onclick="copyBackupText()">কপি করুন</button>
        </div>
      </div>
    `;
  }

  if (m.type === 'importText') {
    return `
      <div class="overlay center" onclick="closeModalBG(event)">
        <div class="sheet">
          <div class="sheet-header">
            <span class="t">টেক্সট থেকে রিস্টোর</span>
            <button class="close-btn" onclick="closeModal()">${ic('x', 16)}</button>
          </div>
          <textarea class="input" id="importTextArea" rows="6" style="font-size:12px;" placeholder="এখানে ব্যাকআপ টেক্সট পেস্ট করুন..."></textarea>
          <button class="primary-btn" style="margin-top:10px;" onclick="submitPasteImport()">রিস্টোর করুন</button>
        </div>
      </div>
    `;
  }

  if (m.type === 'about') {
    return `
      <div class="overlay center" onclick="closeModalBG(event)">
        <div class="sheet">
          <div class="sheet-header">
            <span class="t">আর-রিহলা সম্পর্কে</span>
            <button class="close-btn" onclick="closeModal()">${ic('x', 16)}</button>
          </div>
          <p style="font-size:14px;line-height:1.6;color:var(--text-muted);">
            <strong>আর-রিহলা</strong> — জীবনের গল্প, এক জায়গায়। প্রিয়জনদের জন্মদিন, বিবাহ, শিক্ষা, অর্জন ও জীবনের গুরুত্বপূর্ণ মুহূর্তগুলো সম্পূর্ণ অফলাইনে সংরক্ষণ ও ট্র্যাক করার অ্যাপ।
          </p>
        </div>
      </div>
    `;
  }

  // Month & Year Jump Modal
  if (m.type === 'yearJump') {
    return `
      <div class="overlay center" onclick="closeModalBG(event)">
        <div class="sheet">
          <div class="sheet-header">
            <span class="t">মাস ও সাল নির্বাচন করুন</span>
            <button class="close-btn" onclick="closeModal()">${ic('x', 16)}</button>
          </div>
          <div class="field">
            <div class="field-label">মাস</div>
            <select class="input" id="monthJumpSelect">
              ${bnMonths.map((mn, i) => `<option value="${i}" ${i===state.calMonth?'selected':''}>${mn}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <div class="field-label">সাল</div>
            <input class="input" id="yearJumpInput" type="number" value="${state.calYear}" placeholder="যেমন: ২০২৬">
          </div>
          <button class="primary-btn" style="margin-top:6px;" onclick="submitYearJump()">চলে যান</button>
        </div>
      </div>
    `;
  }

  return '';
}

function renderConfirm() {
  const c = state.confirm;
  if (!c) return '';
  return `
    <div class="overlay center">
      <div class="sheet">
        <p style="font-size:15px;line-height:1.55;margin-bottom:14px;">${c.message}</p>
        ${c.singleButton ? `
          <button class="primary-btn" onclick="closeConfirm()">ঠিক আছে</button>
        ` : `
          <div style="display:flex;gap:10px;">
            <button class="ghost-btn" style="margin-top:0;" onclick="closeConfirm()">বাতিল</button>
            <button class="primary-btn" style="margin-top:0;" onclick="runConfirm()">নিশ্চিত</button>
          </div>
        `}
      </div>
    </div>
  `;
}

/* ---------- Main Render ---------- */
function render() {
  applyThemeAndAccent();
  saveState();
  checkLockScreen();

  let mainContent = '';
  if (state.selectedPersonId) {
    mainContent = renderPersonProfile();
  } else if (state.tab === 'home') {
    mainContent = renderHome();
  } else if (state.tab === 'calendar') {
    mainContent = renderCalendar();
  } else if (state.tab === 'stats') {
    mainContent = renderStats();
  } else {
    mainContent = renderSettings();
  }

  const navBar = `
    <nav class="bottom-nav">
      <button class="nav-item ${!state.selectedPersonId && state.tab==='home'?'active':''}" onclick="setTab('home')">
        ${ic('home', 21)}
        <span>হোম</span>
      </button>
      <button class="nav-item ${!state.selectedPersonId && state.tab==='calendar'?'active':''}" onclick="setTab('calendar')">
        ${ic('calendar', 21)}
        <span>ক্যালেন্ডার</span>
      </button>
      <div class="nav-center-wrap">
        <button class="nav-fab" onclick="openAddEventGlobal()" aria-label="ইভেন্ট যোগ করুন">+</button>
      </div>
      <button class="nav-item ${!state.selectedPersonId && state.tab==='stats'?'active':''}" onclick="setTab('stats')">
        ${ic('chart', 21)}
        <span>পরিসংখ্যান</span>
      </button>
      <button class="nav-item ${!state.selectedPersonId && state.tab==='settings'?'active':''}" onclick="setTab('settings')">
        ${ic('settings', 21)}
        <span>সেটিংস</span>
      </button>
    </nav>
  `;

  document.getElementById('app').innerHTML = mainContent + navBar + renderModal() + renderConfirm();
}

/* ---------- Actions ---------- */
function setTab(t) {
  state.selectedPersonId = null;
  state.tab = t;
  if (t === 'stats' && !state.statsPersonId && state.people.length > 0) {
    state.statsPersonId = state.people[0].id;
  }
  render();
}
function openPersonProfile(id) {
  state.selectedPersonId = id;
  state.profileSubTab = 'events';
  state.profileCatFilter = 'all';
  render();
}
function closePersonProfile() {
  state.selectedPersonId = null;
  render();
}
function setProfileSubTab(t) {
  state.profileSubTab = t;
  render();
}
function setProfileCatFilter(cat) {
  state.profileCatFilter = cat;
  render();
}
function togglePinPerson(id) {
  const p = findPerson(id);
  if (!p) return;
  p.pinned = !p.pinned;
  render();
  showToast(p.pinned ? 'ব্যক্তিকে উপরে পিন করা হয়েছে' : 'পিন সরানো হয়েছে');
}
function toggleSearch() {
  state.searchOpen = !state.searchOpen;
  if (!state.searchOpen) state.query = '';
  render();
  if (state.searchOpen) {
    setTimeout(() => {
      const inp = document.getElementById('homeSearchInput');
      if (inp) inp.focus();
    }, 30);
  }
}
function onSearchInput(v) {
  state.query = v;
  render();
  const inp = document.getElementById('homeSearchInput');
  if (inp) { inp.focus(); inp.setSelectionRange(v.length, v.length); }
}
function clearSearch() {
  state.query = '';
  render();
}
function setTheme(t) { state.theme = t; render(); }
function setAccent(idx) { state.accent = idx; render(); }
function setStatsFilter(f) {
  state.statsFilter = f;
  if (f === 'person' && !state.statsPersonId && state.people.length > 0) {
    state.statsPersonId = state.people[0].id;
  }
  render();
}
function setStatsPerson(id) { state.statsPersonId = id; render(); }
function toggleStatsShowAll() { state.statsShowAll = !state.statsShowAll; render(); }
function openModal(m) { state.modal = m; render(); }
function closeModal() { state.modal = null; render(); }
function closeModalBG(ev) { if (ev.target.classList.contains('overlay')) closeModal(); }
function showConfirm(message, onConfirm) { state.confirm = {message, onConfirm}; render(); }
function closeConfirm() { state.confirm = null; render(); }
function runConfirm() {
  const c = state.confirm;
  if (c && typeof c.onConfirm === 'function') c.onConfirm();
  state.confirm = null;
  render();
}
function alertBox(msg) { state.confirm = {message: msg, singleButton: true}; render(); }

function openAddEventGlobal() {
  openModal({type: 'addEvent', personId: state.selectedPersonId || (state.people[0] ? state.people[0].id : null)});
}
function openAddEventFor(pid) {
  openModal({type: 'addEvent', personId: pid});
}
function pickEventPerson(el, pid) {
  curPersonId = pid;
  document.querySelectorAll('.person-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}
function pickCategory(el, key) {
  curCategory = key;
  curIcon = catOf(key).icon;
  document.querySelectorAll('#catGrid .cat-tile').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function submitAddPerson() {
  const name = document.getElementById('personNameInput').value.trim();
  const relation = document.getElementById('personRelationInput').value.trim();
  if (!name) return;
  const id = ++uid + 1000;
  state.people.push({id, name, relation, pinned: false, events: []});
  state.selectedPersonId = id;
  closeModal();
}
function submitEditPerson(pid) {
  const name = document.getElementById('personNameInput').value.trim();
  const relation = document.getElementById('personRelationInput').value.trim();
  if (!name) return;
  const p = findPerson(pid);
  if (p) { p.name = name; p.relation = relation; }
  closeModal();
}
function submitAddEvent() {
  const name = document.getElementById('evName').value.trim();
  const date = document.getElementById('evDate').value;
  const note = document.getElementById('evNote').value.trim();
  if (!name || !date || !curPersonId) return;
  const p = findPerson(curPersonId);
  if (!p) return;
  if (!p.events) p.events = [];
  p.events.push({id: ++uid, name, category: curCategory, icon: curIcon, date, note});
  state.selectedPersonId = curPersonId;
  closeModal();
}
function submitEditEvent(pid, eid) {
  const name = document.getElementById('evName').value.trim();
  const date = document.getElementById('evDate').value;
  const note = document.getElementById('evNote').value.trim();
  if (!name || !date) return;
  const ev = findEvent(pid, eid);
  if (ev) {
    ev.name = name; ev.date = date; ev.category = curCategory; ev.icon = curIcon; ev.note = note;
  }
  closeModal();
}

function saveNewPin() {
  const val = document.getElementById('newPinInput').value.trim();
  if (!/^[0-9]{4}$/.test(val)) {
    alertBox('দয়া করে ৪ সংখ্যার ইংরেজি ডিজিট (যেমন: 1234) দিন।');
    return;
  }
  state.pinCode = val;
  state.unlocked = true;
  closeModal();
  showToast('অ্যাপ লক পিন সেট করা হয়েছে');
}
function removePin() {
  state.pinCode = '';
  state.unlocked = true;
  closeModal();
  showToast('অ্যাপ লক বন্ধ করা হয়েছে');
}

let newCatIconSel = 'star', newCatColorSel = '#145a3a', newCatBgSel = '#e5f3ea';
function pickNewCatIcon(el, ik) {
  newCatIconSel = ik;
  document.querySelectorAll('#newCatIconGrid .icon-opt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  const prev = document.getElementById('newCatPreview');
  if (prev) prev.innerHTML = ic(ik, 26);
}
function pickNewCatColor(el) {
  newCatColorSel = el.dataset.color;
  newCatBgSel = el.dataset.bg;
  document.querySelectorAll('#newCatColorRow .color-opt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  const prev = document.getElementById('newCatPreview');
  if (prev) { prev.style.background = newCatBgSel; prev.style.color = newCatColorSel; }
}
function submitNewCategory(returnTo) {
  const name = document.getElementById('newCatName').value.trim();
  if (!name) return;
  const key = 'custom_' + (++uid);
  state.customCats[key] = {label: name, color: newCatColorSel, bg: newCatBgSel, icon: newCatIconSel};
  curCategory = key;
  curIcon = newCatIconSel;
  if (returnTo) {
    openModal({type: returnTo, _init: true});
  } else {
    closeModal();
    showToast('নতুন ক্যাটাগরি যোগ হয়েছে');
  }
}

let undoSnap = null;
function snapForUndo() {
  undoSnap = JSON.stringify({people: state.people, customCats: state.customCats});
}
function doUndo() {
  if (!undoSnap) return;
  const s = JSON.parse(undoSnap);
  state.people = s.people; state.customCats = s.customCats; undoSnap = null;
  document.getElementById('toastHost').innerHTML = '';
  render();
}
function undoToast(msg) {
  showToast(`${msg} <button class="toast-act" onclick="doUndo()">ফিরিয়ে আনুন</button>`, 5500);
}
function deletePerson(id) {
  snapForUndo();
  state.people = state.people.filter(p => p.id !== id);
  state.selectedPersonId = null;
  render();
  undoToast('ব্যক্তি মুছে ফেলা হয়েছে');
}
function deleteEvent(pid, eid) {
  snapForUndo();
  const p = findPerson(pid);
  if (p) p.events = (p.events || []).filter(e => e.id !== eid);
  state.modal = null;
  render();
  undoToast('ইভেন্ট মুছে ফেলা হয়েছে');
}
function resetAll() {
  showConfirm('সব ব্যক্তি, ইভেন্ট ও ক্যাটাগরি স্থায়ীভাবে মুছে যাবে। নিশ্চিত?', () => {
    state.people = []; state.customCats = {}; state.selectedPersonId = null; state.modal = null;
  });
}

/* Calendar & Date Picker */
function calNav(dir) {
  state.calMonth += dir;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  state.calSelected = 1;
  render();
}
function calToday() {
  const t = new Date();
  state.calYear = t.getFullYear(); state.calMonth = t.getMonth(); state.calSelected = t.getDate();
  render();
}
function selectCalDay(d) { state.calSelected = d; render(); }
function submitYearJump() {
  const mVal = parseInt(document.getElementById('monthJumpSelect').value, 10);
  const val = parseInt(document.getElementById('yearJumpInput').value, 10);
  if (!val || val < 1900 || val > 2200) return;
  state.calMonth = mVal;
  state.calYear = val;
  state.modal = null;
  render();
}

function toggleDatePicker(ev) {
  ev.stopPropagation();
  const popup = document.getElementById('dpPopup');
  if (popup.style.display === 'none') {
    dpYear = dpSelYear; dpMonth = dpSelMonth;
    renderDatePicker();
    popup.style.display = 'block';
  } else {
    popup.style.display = 'none';
  }
}
function dpNav(dir) {
  dpMonth += dir;
  if (dpMonth < 0) { dpMonth = 11; dpYear--; }
  if (dpMonth > 11) { dpMonth = 0; dpYear++; }
  renderDatePicker();
}
function renderDatePicker() {
  const popup = document.getElementById('dpPopup');
  const first = new Date(dpYear, dpMonth, 1).getDay();
  const days = new Date(dpYear, dpMonth + 1, 0).getDate();
  const curYear = new Date().getFullYear();
  let cells = '';
  for (let i = 0; i < first; i++) cells += `<div></div>`;
  for (let d = 1; d <= days; d++) {
    const isSel = dpSelYear === dpYear && dpSelMonth === dpMonth && dpSelDay === d;
    cells += `<div class="dp-cell ${isSel?'selected':''}" onclick="dpSelectDay(${d})">${toBn(d)}</div>`;
  }
  let yearOpts = '';
  for (let y = curYear - 100; y <= curYear + 15; y++) {
    yearOpts += `<option value="${y}" ${y===dpYear?'selected':''}>${toBn(y)}</option>`;
  }
  popup.innerHTML = `
    <div class="dp-head">
      <button type="button" class="dp-navbtn" onclick="dpNav(-1)">‹</button>
      <select class="dp-select" onchange="dpMonth=parseInt(this.value,10);renderDatePicker()">
        ${bnMonths.map((mn,i)=>`<option value="${i}" ${i===dpMonth?'selected':''}>${mn}</option>`).join('')}
      </select>
      <select class="dp-select" onchange="dpYear=parseInt(this.value,10);renderDatePicker()">${yearOpts}</select>
      <button type="button" class="dp-navbtn" onclick="dpNav(1)">›</button>
    </div>
    <div class="dp-weekdays">${bnWeekdaysShort.map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="dp-days">${cells}</div>
    <div class="dp-quickrow">
      <button type="button" class="dp-quick" onclick="dpQuickToday()">আজকে</button>
      <button type="button" class="dp-quick" onclick="document.getElementById('dpPopup').style.display='none'">বন্ধ করুন</button>
    </div>
  `;
}
function dpSelectDay(d) {
  dpSelYear = dpYear; dpSelMonth = dpMonth; dpSelDay = d;
  document.getElementById('evDate').value = `${dpYear}-${String(dpMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  document.getElementById('evDateDisplay').textContent = fmtBnDate(new Date(dpYear, dpMonth, d));
  document.getElementById('dpPopup').style.display = 'none';
}
function dpQuickToday() {
  const t = new Date();
  dpYear = t.getFullYear(); dpMonth = t.getMonth();
  dpSelectDay(t.getDate());
}

/* Export full Life Summary for a Person */
async function exportPersonSummary(pid) {
  const p = findPerson(pid);
  if (!p) return;
  const evs = (p.events || []).slice().sort((a, b) => parseDate(a.date) - parseDate(b.date));
  const lines = [
    `📖 ${p.name}${p.relation ? ' (' + p.relation + ')' : ''} — জীবনবৃত্তান্ত`,
    `মোট ইভেন্ট: ${toBnPlain(evs.length)}টি`,
    '-------------------------'
  ];
  evs.forEach((e, idx) => {
    const cat = catOf(e.category);
    const dur = durationDisplay(e.date).big.replace(/<[^>]+>/g, '');
    const dStr = fmtBnDate(parseDate(e.date)).replace(/<[^>]+>/g, '');
    lines.push(`${toBnPlain(idx+1)}. ${e.name} [${cat.label}]`);
    lines.push(`   তারিখ: ${dStr} (${dur})`);
    if (e.note) lines.push(`   নোট: ${e.note}`);
  });
  lines.push('', '— আর-রিহলা অ্যাপ');
  const text = lines.join('\n');
  try {
    if (navigator.share) { await navigator.share({title: `${p.name} — জীবনবৃত্তান্ত`, text}); return; }
  } catch (err) {}
  try { await navigator.clipboard.writeText(text); showToast('সম্পূর্ণ জীবনবৃত্তান্ত কপি হয়েছে'); }
  catch (err) {}
}

/* Backup, Restore & Share */
function backupPayload() {
  return JSON.stringify({people: state.people, uid, dark: state.dark, customCats: state.customCats, exportedAt: new Date().toISOString()});
}
async function copyBackupDirect() {
  const payload = backupPayload();
  try {
    await navigator.clipboard.writeText(payload);
    showToast('ব্যাকআপ কপি হয়েছে — Notes বা Drive-এ পেস্ট করে রাখুন', 3200);
  } catch (e) {
    state.modal = {type: 'backupText', payload};
    render();
  }
}
async function exportBackup() {
  const payload = JSON.stringify({people: state.people, uid, dark: state.dark, customCats: state.customCats, exportedAt: new Date().toISOString()}, null, 2);
  try {
    if (navigator.share) {
      const file = new File([payload], `ar-rihla-backup-${new Date().toISOString().slice(0,10)}.json`, {type: 'application/json'});
      if (!navigator.canShare || navigator.canShare({files: [file]})) {
        await navigator.share({files: [file], title: 'আর-রিহলা ব্যাকআপ'});
        return;
      }
    }
  } catch (e) {}
  state.modal = {type: 'backupText', payload};
  render();
}
function copyBackupText() {
  const ta = document.getElementById('backupTextArea');
  ta.select();
  try { navigator.clipboard.writeText(ta.value); alertBox('ব্যাকআপ টেক্সট কপি হয়েছে।'); }
  catch (e) { document.execCommand('copy'); alertBox('ব্যাকআপ টেক্সট কপি হয়েছে।'); }
}
function mergeImportedData(data) {
  let addedPeople = 0, addedEvents = 0;
  (data.people || []).forEach(ip => {
    let existing = state.people.find(p => p.name === ip.name);
    if (!existing) {
      existing = {id: ++uid, name: ip.name, relation: ip.relation || '', pinned: !!ip.pinned, events: []};
      state.people.push(existing);
      addedPeople++;
    }
    (ip.events || []).forEach(ie => {
      const dup = existing.events.some(e => e.name === ie.name && e.date === ie.date);
      if (!dup) {
        existing.events.push({id: ++uid, name: ie.name, category: ie.category || 'other', icon: ie.icon || 'star', date: ie.date, note: ie.note || ''});
        addedEvents++;
      }
    });
  });
  Object.assign(state.customCats, data.customCats || {});
  return {addedPeople, addedEvents};
}
function triggerImport() { document.getElementById('importFileInput').click(); }
function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.people)) throw new Error('Invalid');
      showConfirm('এই ব্যাকআপের ডেটা বর্তমান ডেটার সাথে যুক্ত হবে। এগিয়ে যেতে চান?', () => {
        const res = mergeImportedData(data);
        saveState(); state.modal = null;
        alertBox(`${toBn(res.addedPeople)} জন নতুন ব্যক্তি ও ${toBn(res.addedEvents)}টি নতুন ইভেন্ট যোগ হয়েছে।`);
      });
    } catch (e) { alertBox('এই ফাইলটি সঠিক ব্যাকআপ ফাইল নয়।'); }
    input.value = '';
  };
  reader.readAsText(file);
}
function submitPasteImport() {
  const raw = document.getElementById('importTextArea').value.trim();
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.people)) throw new Error('Invalid');
    showConfirm('এই ব্যাকআপের ডেটা বর্তমান ডেটার সাথে যুক্ত হবে। এগিয়ে যেতে চান?', () => {
      const res = mergeImportedData(data);
      saveState(); state.modal = null;
      alertBox(`${toBn(res.addedPeople)} জন নতুন ব্যক্তি ও ${toBn(res.addedEvents)}টি নতুন ইভেন্ট যোগ হয়েছে।`);
    });
  } catch (e) { alertBox('এই টেক্সটটি সঠিক ব্যাকআপ ফরম্যাটে নেই।'); }
}
async function shareEvent(pid, eid) {
  const e = findEvent(pid, eid), p = findPerson(pid), cat = catOf(e.category), dur = durationDisplay(e.date);
  const text = [
    e.name,
    `ব্যক্তি: ${p.name}`,
    `ক্যাটাগরি: ${cat.label}`,
    `তারিখ: ${fmtBnDate(parseDate(e.date)).replace(/<[^>]+>/g,'')}`,
    dur.future ? `সময়: ${dur.big.replace(/<[^>]+>/g,'')}` : `পার হয়েছে: ${dur.big.replace(/<[^>]+>/g,'')}`,
    e.note ? `নোট: ${e.note}` : '',
    '', '— আর-রিহলা অ্যাপ'
  ].filter(Boolean).join('\n');
  try {
    if (navigator.share) { await navigator.share({title: e.name, text}); return; }
  } catch (err) {}
  try { await navigator.clipboard.writeText(text); showToast('ইভেন্ট তথ্য কপি হয়েছে'); }
  catch (err) {}
}
function showToast(msg, duration) {
  const host = document.getElementById('toastHost');
  if (!host) return;
  host.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { host.innerHTML = ''; }, duration || 2400);
}

/* Back Button Guard */
let backTimer = null;
function pushGuard() { try { history.pushState({arihla: true}, ''); } catch (e) {} }
pushGuard();
window.addEventListener('popstate', () => {
  if (state.modal) { state.modal = null; render(); pushGuard(); return; }
  if (state.confirm) { state.confirm = null; render(); pushGuard(); return; }
  if (state.selectedPersonId) { state.selectedPersonId = null; render(); pushGuard(); return; }
  if (state.tab !== 'home') { state.tab = 'home'; render(); pushGuard(); return; }
  showToast('আবার ব্যাক চাপলে অ্যাপ বন্ধ হবে', 2000);
  clearTimeout(backTimer);
  backTimer = setTimeout(pushGuard, 2100);
});

try {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (state.theme === 'system') render();
  });
} catch (e) {}

loadState();
render();
</script>
